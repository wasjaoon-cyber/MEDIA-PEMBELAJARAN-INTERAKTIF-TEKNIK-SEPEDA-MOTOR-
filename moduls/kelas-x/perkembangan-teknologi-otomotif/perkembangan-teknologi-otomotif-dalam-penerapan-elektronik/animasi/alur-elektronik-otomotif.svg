<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
<style>
.t{font:700 24px Arial;fill:#16304f}.s{font:18px Arial;fill:#52677d}
.box{fill:#fff;stroke:#0b5ed7;stroke-width:4}.sensor{fill:#eaf3ff;stroke:#0b5ed7;stroke-width:3}
.act{fill:#e9fff6;stroke:#139b73;stroke-width:3}.ecu{fill:#fff5dc;stroke:#f39c12;stroke-width:4}
.flow{stroke:#0b5ed7;stroke-width:6;fill:none;stroke-dasharray:12 10;animation:move 1.2s linear infinite}
@keyframes move{to{stroke-dashoffset:-44}}
</style>
<rect width="900" height="420" rx="28" fill="#f3f7fc"/>
<text x="450" y="42" text-anchor="middle" class="t">Alur Dasar Penerapan Elektronik Otomotif</text>
<rect x="60" y="105" width="190" height="230" rx="20" class="box"/>
<text x="155" y="140" text-anchor="middle" class="t">SENSOR</text>
<rect x="85" y="165" width="140" height="45" rx="12" class="sensor"/><text x="155" y="194" text-anchor="middle" class="s">TPS / MAP</text>
<rect x="85" y="225" width="140" height="45" rx="12" class="sensor"/><text x="155" y="254" text-anchor="middle" class="s">CKP / ECT</text>
<rect x="85" y="285" width="140" height="30" rx="10" class="sensor"/><text x="155" y="307" text-anchor="middle" class="s">Sensor lain</text>
<rect x="340" y="125" width="220" height="190" rx="24" class="ecu"/>
<text x="450" y="175" text-anchor="middle" class="t">ECU / ECM</text>
<text x="450" y="210" text-anchor="middle" class="s">Input → Proses → Keputusan</text>
<text x="450" y="245" text-anchor="middle" class="s">Program + data sensor</text>
<text x="450" y="280" text-anchor="middle" class="s">Mengirim perintah</text>
<rect x="650" y="105" width="190" height="230" rx="20" class="box"/>
<text x="745" y="140" text-anchor="middle" class="t">AKTUATOR</text>
<rect x="675" y="165" width="140" height="45" rx="12" class="act"/><text x="745" y="194" text-anchor="middle" class="s">Injektor</text>
<rect x="675" y="225" width="140" height="45" rx="12" class="act"/><text x="745" y="254" text-anchor="middle" class="s">Koil / Motor</text>
<rect x="675" y="285" width="140" height="30" rx="10" class="act"/><text x="745" y="307" text-anchor="middle" class="s">Relay / Solenoid</text>
<path d="M250 220 H340" class="flow"/><path d="M560 220 H650" class="flow"/>
<text x="295" y="205" text-anchor="middle" class="s">data</text><text x="605" y="205" text-anchor="middle" class="s">perintah</text>
</svg>